name: SOMADEX V2 Visual QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  capture-overworld:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install virtual display
        run: |
          apt-get update
          apt-get install -y xvfb
      - name: Import and parse project
        run: godot --headless --path . --editor --quit-after 5
      - name: Capture clean overworld runtime
        run: |
          mkdir -p qa
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_overworld.png"
          unset SOMADEX_QA_SHOW_TOUCH
          unset SOMADEX_QA_MODE
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_overworld.png
      - name: Capture handheld touch composition
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_mobile.png"
          export SOMADEX_QA_SHOW_TOUCH=1
          unset SOMADEX_QA_MODE
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_mobile.png
      - name: Capture START menu composition
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_start_menu.png"
          export SOMADEX_QA_SHOW_TOUCH=1
          export SOMADEX_QA_MODE=menu
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_start_menu.png
      - name: Capture GameState party page
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_party_menu.png"
          export SOMADEX_QA_SHOW_TOUCH=1
          export SOMADEX_QA_MODE=menu_party
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_party_menu.png
      - name: Capture battle command composition with touch controls
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_battle_touch.png"
          export SOMADEX_QA_SHOW_TOUCH=1
          export SOMADEX_QA_MODE=battle
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_battle_touch.png
      - name: Capture battle party selector with touch controls
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_battle_party_touch.png"
          export SOMADEX_QA_SHOW_TOUCH=1
          export SOMADEX_QA_MODE=battle_party
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_battle_party_touch.png
      - name: Capture battle bag with touch controls
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_battle_bag_touch.png"
          export SOMADEX_QA_SHOW_TOUCH=1
          export SOMADEX_QA_MODE=battle_bag
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_battle_bag_touch.png
      - name: Capture Rezonans-ready move screen with touch controls
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_battle_rez_touch.png"
          export SOMADEX_QA_SHOW_TOUCH=1
          export SOMADEX_QA_MODE=battle_rez
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_battle_rez_touch.png
      - name: Capture NPC dialogue composition
        run: |
          export SOMADEX_CAPTURE_PATH="$GITHUB_WORKSPACE/qa/vela_dialogue.png"
          unset SOMADEX_QA_SHOW_TOUCH
          export SOMADEX_QA_MODE=dialogue
          timeout 30s xvfb-run -a godot --path . --display-driver x11
          test -s qa/vela_dialogue.png
      - name: Upload runtime screenshots
        uses: actions/upload-artifact@v4
        with:
          name: somadex-v2-gameplay-android-qa
          path: qa/*.png
          if-no-files-found: error
